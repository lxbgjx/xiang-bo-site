<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>访问记录 · 后台</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#F6F3EC">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/css/site.css">
<style>
  body{background:var(--paper);color:var(--ink);}
  [hidden]{display:none!important;}
  .adm{max-width:1120px;margin:0 auto;padding:clamp(28px,5vw,64px) var(--gut) 80px;}
  .adm-head{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap;
    border-bottom:1px solid var(--line);padding-bottom:20px;margin-bottom:28px;}
  .adm-head h1{font-family:var(--serif);font-size:clamp(26px,3.4vw,40px);line-height:1.15;margin:10px 0 0;font-weight:600;letter-spacing:-.01em;}
  .adm-head .sub{color:var(--ink-3);font-size:14px;margin-top:8px;}
  .tagline{font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);}
  .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  .btn{font:inherit;font-size:13px;padding:9px 16px;border:1px solid var(--ink);background:var(--ink);color:var(--paper);
    cursor:pointer;border-radius:2px;transition:opacity .2s;}
  .btn:hover{opacity:.82;}
  .btn.ghost{background:transparent;color:var(--ink);border-color:var(--line);}
  .btn.ghost.on{background:var(--ink);color:var(--paper);border-color:var(--ink);}
  .pin{display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:var(--white);border:1px solid var(--line);
    padding:18px;border-radius:3px;}
  .pin input{font:inherit;font-size:14px;padding:10px 12px;border:1px solid var(--line);background:var(--paper);
    border-radius:2px;min-width:220px;color:var(--ink);}
  .pin input:focus{outline:none;border-color:var(--ink);}
  .hint{font-size:13px;color:var(--ink-3);line-height:1.7;}
  .hint code{font-family:var(--mono);font-size:12px;background:var(--paper-2);padding:2px 6px;border-radius:2px;}
  .stats{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--line);border:1px solid var(--line);
    margin:24px 0 30px;border-radius:3px;overflow:hidden;}
  .stats div{background:var(--white);padding:20px 16px;}
  .stats b{display:block;font-family:var(--serif);font-size:clamp(22px,2.5vw,31px);font-weight:600;line-height:1;white-space:nowrap;}
  .stats span{display:block;margin-top:8px;font-size:12px;color:var(--ink-3);letter-spacing:.02em;}
  .wrap-tbl{background:var(--white);border:1px solid var(--line);border-radius:3px;overflow:hidden;}
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  thead th{text-align:left;font-weight:600;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--muted);padding:13px 14px;border-bottom:1px solid var(--line);background:var(--paper-2);white-space:nowrap;}
  tbody td{padding:12px 14px;border-bottom:1px solid var(--line-2);vertical-align:middle;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:rgba(23,24,27,.018);}
  .mono{font-family:var(--mono);font-size:12.5px;color:var(--ink-2);white-space:nowrap;}
  .page{font-weight:600;color:var(--ink);word-break:break-all;}
  .dur{font-family:var(--mono);font-size:12.5px;color:var(--ink-2);white-space:nowrap;}
  .dur b{color:var(--ink);font-weight:600;}
  .pill{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;background:var(--paper-2);color:var(--ink-3);white-space:nowrap;}
  .reg,.dev,.dur{white-space:nowrap;}
  .pill.new{background:rgba(178,58,46,.1);color:var(--red);}
  .empty{padding:60px 20px;text-align:center;color:var(--ink-3);font-size:14px;}
  .foot{margin-top:26px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);}
  .err{margin:18px 0;padding:14px 16px;border-left:3px solid var(--red);background:rgba(178,58,46,.06);
    font-size:13.5px;line-height:1.75;color:var(--ink-2);}
  .err b{color:var(--red);}
  .err ol{margin:8px 0 0 18px;padding:0;}
  .err li{margin:4px 0;}
  @media (max-width:760px){
    .stats{grid-template-columns:repeat(2,1fr);}
    .stats div:last-child{grid-column:1/-1;}
    thead{display:none;}
    tbody tr{display:block;padding:14px 14px 10px;border-bottom:1px solid var(--line);}
    tbody td{display:block;padding:3px 0;border:none;}
    tbody td::before{content:attr(data-l);display:inline-block;width:52px;color:var(--muted);font-size:11.5px;letter-spacing:.08em;}
  }
</style>
</head>
<body>

<div class="adm">
  <div class="adm-head">
    <div>
      <span class="tagline">xiang-bo.top / admin</span>
      <h1>访问记录</h1>
      <p class="sub">谁在什么时候打开过这里，看了哪个页面、待了多久、从哪儿来的。</p>
    </div>
    <div class="toolbar">
      <button class="btn ghost" id="fAll">全部</button>
      <button class="btn ghost on" id="fToday">今天</button>
      <button class="btn ghost" id="f7">近 7 天</button>
      <button class="btn" id="reload">刷新</button>
    </div>
  </div>

  <div class="pin" id="pin" hidden>
    <input type="password" id="key" placeholder="访问口令" autocomplete="current-password">
    <button class="btn" id="enter">进入</button>
    <span class="hint">口令在 Vercel 项目的 <code>STATS_KEY</code> 环境变量里。</span>
  </div>

  <div id="msg"></div>

  <div id="panel" hidden>
    <div class="stats">
      <div><b id="sToday">0</b><span>今日访问</span></div>
      <div><b id="sUv">0</b><span>今日访客（按 IP 去重）</span></div>
      <div><b id="s7">0</b><span>近 7 天访问</span></div>
      <div><b id="sAvg">—</b><span>今日平均停留</span></div>
      <div><b id="sTotal">0</b><span>累计访问</span></div>
    </div>

    <div class="wrap-tbl">
      <table>
        <thead>
          <tr>
            <th>时间</th><th>IP</th><th>地区</th><th>页面 / 作品</th><th>停留</th><th>来源</th><th>设备</th><th>访客</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
      <div class="empty" id="empty" hidden>这个时间段还没有记录。</div>
    </div>

    <div class="foot">
      <span id="meta">—</span>
      <span>每 30 秒自动刷新 · 只保留最近 5000 条 · 停留不足 2 秒不计</span>
    </div>
  </div>
</div>

<script>
(function () {
  var KEY = 'xb_stats_key';
  var all = [];
  var filter = 'today';
  var total = 0;
  var timer = null;

  var $ = function (s) { return document.querySelector(s); };

  function key() { return sessionStorage.getItem(KEY) || ''; }

  function fmtTime(t) {
    var d = new Date(t);
    var p = function (n) { return n < 10 ? '0' + n : '' + n; };
    return p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' +
      p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
  }

  function dayStart(offset) {
    var d = new Date();
    d.setHours(0, 0, 0, 0);
    return d.getTime() - offset * 86400000;
  }

  function region(v) {
    var a = [];
    if (v.ct) a.push(v.ct);
    if (v.rg) a.push(v.rg);
    if (v.cc) a.push(v.cc);
    return a.length ? a.join(' · ') : '—';
  }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  /* 停留时长：不足一分钟按秒，超过按分秒 */
  function fmtDur(s) {
    var n = Math.round(Number(s) || 0);
    if (n < 1) return '—';
    if (n < 60) return n + ' 秒';
    var m = Math.floor(n / 60);
    var r = n % 60;
    return m + ' 分' + (r ? ' ' + r + ' 秒' : '');
  }

  /* 作品详情页显示作品名，其余显示页面路径 */
  function pageCell(v) {
    if (v.ti) return '<span class="pill">作品</span> ' + esc(v.ti);
    return esc(v.p || '—');
  }

  function showMsg(html) { $('#msg').innerHTML = html || ''; }

  function render() {
    var since = filter === 'today' ? dayStart(0) : (filter === '7' ? dayStart(6) : 0);
    var list = all.filter(function (v) { return v.t >= since; });

    var today = all.filter(function (v) { return v.t >= dayStart(0); });
    var ipSet = {};
    today.forEach(function (v) { if (v.ip) ipSet[v.ip] = 1; });
    $('#sToday').textContent = today.length;
    $('#sUv').textContent = Object.keys(ipSet).length;
    $('#s7').textContent = all.filter(function (v) { return v.t >= dayStart(6); }).length;
    $('#sTotal').textContent = total.toLocaleString('en-US');

    /* 只统计有停留数据的记录，页面上待不到 2 秒的不参与平均 */
    var timed = today.filter(function (v) { return v.d > 0; });
    var avg = timed.length
      ? timed.reduce(function (a, v) { return a + v.d; }, 0) / timed.length
      : 0;
    $('#sAvg').textContent = avg ? fmtDur(avg) : '—';

    $('#rows').innerHTML = list.map(function (v) {
      return '<tr>' +
        '<td data-l="时间" class="mono" title="' + new Date(v.t).toLocaleString('zh-CN') + '">' + fmtTime(v.t) + '</td>' +
        '<td data-l="IP" class="mono">' + (v.ip || '—') + '</td>' +
        '<td data-l="地区" class="reg">' + region(v) + '</td>' +
        '<td data-l="页面" class="page">' + pageCell(v) + '</td>' +
        '<td data-l="停留" class="dur">' + fmtDur(v.d) + '</td>' +
        '<td data-l="来源">' + esc(v.r || '直接打开') + '</td>' +
        '<td data-l="设备" class="dev">' + esc((v.dv || '—') + ' · ' + (v.br || '—')) + '</td>' +
        '<td data-l="访客"><span class="pill' + (v.n ? ' new' : '') + '">' + (v.n ? '新访客' : '回访') + '</span></td>' +
        '</tr>';
    }).join('');

    $('#empty').hidden = list.length > 0;
    $('#meta').textContent = '当前显示 ' + list.length + ' 条 · 已载入最近 ' + all.length + ' 条' +
      (timed.length ? ' · 今日平均停留 ' + fmtDur(avg) : '');
  }

  function load() {
    if (!key()) { $('#pin').hidden = false; $('#panel').hidden = true; return; }
    fetch('/api/stats?limit=600', { headers: { 'x-stats-key': key() }, cache: 'no-store' })
      .then(function (r) { return r.json().then(function (j) { return { s: r.status, j: j }; }); })
      .then(function (o) {
        if (o.s === 401) {
          sessionStorage.removeItem(KEY);
          $('#pin').hidden = false;
          $('#panel').hidden = true;
          showMsg('<div class="err"><b>口令不对。</b>重新输入一次。</div>');
          return;
        }
        if (o.s === 503) {
          $('#panel').hidden = true;
          if (o.j.error === 'key_not_configured') {
            showMsg('<div class="err"><b>还没设访问口令。</b>去 Vercel 项目设置里加一个环境变量 ' +
              '<code>STATS_KEY</code>（自己定一串字符），重新部署后就能进。</div>');
          } else {
            showMsg('<div class="err"><b>还没接上存储。</b>访问记录需要一个 Redis。步骤：' +
              '<ol><li>Vercel 项目 → Storage → Create Database → Upstash for Redis（免费额度够用）</li>' +
              '<li>创建后点 Connect Project，选这个站点，环境变量会自动注入</li>' +
              '<li>再到 Settings → Environment Variables 添加 <code>STATS_KEY</code></li>' +
              '<li>Deployments 里 Redeploy 一次，这里就会开始有数据</li></ol></div>');
          }
          return;
        }
        if (!o.j.ok) { showMsg('<div class="err"><b>读取失败。</b>' + (o.j.error || '未知错误') + '</div>'); return; }
        showMsg('');
        $('#pin').hidden = true;
        $('#panel').hidden = false;
        all = o.j.visits || [];
        total = o.j.total || 0;
        render();
      })
      .catch(function () { showMsg('<div class="err"><b>网络或接口异常。</b>稍后点刷新再试。</div>'); });
  }

  $('#enter').addEventListener('click', function () {
    var v = $('#key').value.trim();
    if (!v) return;
    sessionStorage.setItem(KEY, v);
    load();
  });
  $('#key').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('#enter').click(); });

  $('#reload').addEventListener('click', load);

  function setFilter(f, el) {
    filter = f;
    ['#fAll', '#fToday', '#f7'].forEach(function (s) { $(s).classList.remove('on'); });
    el.classList.add('on');
    render();
  }
  $('#fAll').addEventListener('click', function () { setFilter('all', this); });
  $('#fToday').addEventListener('click', function () { setFilter('today', this); });
  $('#f7').addEventListener('click', function () { setFilter('7', this); });

  load();
  timer = setInterval(function () { if (key() && !document.hidden) load(); }, 30000);
})();
</script>
</body>
</html>
